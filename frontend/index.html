<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAW - Multi-Agent Workbench</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="settings-panel">
        <div class="brand">
          <h1>MAW</h1>
          <p>Multi-Agent Workbench</p>
        </div>

        <form id="run-form" class="control-stack">
          <label class="field">
            <span>Gemini APIキー</span>
            <input id="api-key" type="password" autocomplete="off" placeholder="AIza..." />
          </label>

          <label class="field">
            <span>モデル名</span>
            <input id="model" type="text" value="gemini-3.1-flash-lite" list="model-options" />
            <datalist id="model-options">
              <option value="gemini-3.1-flash-lite"></option>
              <option value="gemini-2.0-flash"></option>
              <option value="gemini-1.5-flash"></option>
              <option value="gemini-1.5-pro"></option>
            </datalist>
          </label>

          <label class="field">
            <span>質問</span>
            <textarea id="question" rows="6" placeholder="複数エージェントに聞きたい質問を入力"></textarea>
          </label>

          <section>
            <div class="section-title">
              <span>エージェント構成</span>
              <button id="reset-agents" type="button" class="ghost-button">初期化</button>
            </div>
            <div id="agent-list" class="agent-list"></div>
          </section>

          <button id="run-button" type="submit" class="primary-button">実行</button>
          <p id="error-message" class="error-message" role="alert"></p>
        </form>
      </aside>

      <section class="workspace">
        <div class="log-header">
          <div>
            <h2>議論ログ</h2>
            <p id="status-text">待機中</p>
          </div>
          <button id="clear-log" type="button" class="ghost-button">クリア</button>
        </div>

        <div id="log-list" class="log-list">
          <div class="empty-state">質問を送信すると、各エージェントの発言がここに表示されます。</div>
        </div>

        <section class="final-panel">
          <h2>最終回答</h2>
          <div class="final-label">Synthesizer</div>
          <div id="final-answer" class="final-answer">まだ最終回答はありません。</div>
        </section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
